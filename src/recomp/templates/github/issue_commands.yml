name: Recomp issue commands

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: recomp-issue-commands
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: __RECOMP_ACTION_REPOSITORY__/.github/actions/recomp-claims@0000000000000000000000000000000000000000
        with:
          token: ${{ github.token }}
          api-url: ${{ github.api_url }}
          owner: ${{ github.repository_owner }}
          repository: ${{ github.event.repository.name }}
          trusted-actor-id: __RECOMP_TRUSTED_ACTOR_ID__
