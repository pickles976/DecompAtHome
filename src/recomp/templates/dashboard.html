<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>recomp — {{PROJECT_NAME}}</title>
<style>
  :root { color-scheme: dark; }
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #101418; color: #dfe6ee; }
  main { max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; } h1 span { color: #7aa2f7; }
  .bars { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1rem 0 1.5rem; }
  .card { background: #171d24; border: 1px solid #232c36; border-radius: 10px; padding: .8rem 1.2rem; min-width: 6rem; }
  .card b { display: block; font-size: 1.6rem; }
  .muted { color: #8b98a5; }
  table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
  td, th { text-align: left; padding: .3rem .5rem; border-bottom: 1px solid #202833; font-size: .9rem; }
  td.num { text-align: right; color: #8b98a5; }
  pre { background: #171d24; border: 1px solid #232c36; border-radius: 10px; padding: 1rem; overflow-x: auto; font-size: .8rem; }
  button { background: #2a3547; color: inherit; border: 1px solid #3a4burn; border-radius: 8px; padding: .4rem .8rem; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>recomp · <span>{{PROJECT_NAME}}</span></h1>
  <p class="muted">live coordination state — trusted progress is what the verifier merged.</p>
  <div class="bars">
    <div class="card">open<b id="open">–</b></div>
    <div class="card">leased<b id="leased">–</b></div>
    <div class="card">merged<b id="merged">–</b></div>
    <div class="card">rejected<b id="rejected">–</b></div>
    <div class="card">policy<b id="policy">–</b></div>
  </div>
  <h2 style="font-size:1rem">Events</h2>
  <table><tbody id="events"></tbody></table>
  <h2 style="font-size:1rem;margin-top:2rem">Contributor prompt</h2>
  <p class="muted">hand this exact prompt to your agent (also at <code>/api/prompt</code>)</p>
  <button onclick="fetch('/api/prompt').then(r=>r.json()).then(d=>navigator.clipboard.writeText(d.prompt));this.textContent='copied'">copy prompt</button>
  <pre id="prompt">loading…</pre>
</main>
<script>
let last = 0;
async function tick() {
  try {
    const p = await (await fetch('/api/progress')).json();
    for (const k of ['open','leased','merged','rejected']) document.getElementById(k).textContent = p[k];
    document.getElementById('policy').textContent = 'v' + p.policy_version;
    const e = await (await fetch('/api/events?since=' + last)).json();
    last = e.last;
    const rows = document.getElementById('events');
    for (const ev of e.events.reverse()) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="num">${ev.id}</td><td>${ev.kind}</td><td>${ev.detail}</td>`;
      rows.prepend(tr);
    }
  } catch (_) {}
}
fetch('/api/prompt').then(r=>r.json()).then(d=>document.getElementById('prompt').textContent=d.prompt);
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
