[plugin]
name = "generic"
version = "0.1.0"
description = "T1 structure recovery: deterministic string scans over the target binary, verifiable end to end."
capabilities = ["detect", "work", "verify"]

[verify]
mode = "static"
public = true
timeout_seconds = 30
max_artifact_bytes = 1048576

[commands]
detect = ["python3", "runner.py", "detect"]
work_plan = ["python3", "runner.py", "work-plan"]
run_task = ["python3", "runner.py", "run-task"]
verify = ["python3", "runner.py", "verify"]
selftest = ["python3", "runner.py", "selftest"]
