name: Recomp pull-request preflight
description: Validate immutable task bindings and pull-request trees without checkout.
inputs:
  token:
    description: Read-only GitHub token.
    required: true
  api-url:
    description: GitHub API origin.
    required: true
  owner:
    description: Repository owner.
    required: true
  repository:
    description: Repository name.
    required: true
  trusted-actor-id:
    description: Immutable GitHub App bot actor ID.
    required: true
outputs:
  codes:
    description: Stable comma-separated preflight codes.
    value: ${{ steps.preflight.outputs.codes }}
runs:
  using: composite
  steps:
    - id: preflight
      shell: bash
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_OWNER: ${{ inputs.owner }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_TRUSTED_ACTOR_ID: ${{ inputs.trusted-actor-id }}
      run: python3 "$GITHUB_ACTION_PATH/action.py"
